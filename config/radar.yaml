timezone: Europe/Paris

log_level: info

database:
  host: postgres
  port: 5432
  user: radar
  password: radar
  name: radar

briefing:
  # This slot runs BOTH the ranking stage and the briefing synthesis (~2 min).
  # Moved 09:00 → 08:05 on 2026-11-07: the daily cards now go out at 08:33 with
  # the morning recap, and they read the scores — scoring after them meant an
  # empty selection every day.
  schedules: ["08:05"]
  max_items: 10
  max_trends: 3

notify:
  # Score threshold for the #radar cards (read by notifications.py). Raised
  # 0.5 -> 0.6 on 2026-09-13: with the X collector back, 0.5 surfaced too much.
  # 0.6 -> 0.65 on 2026-09-17 (user request): 48 cards/day was too much noise.
  # 0.65 -> 0.7 on 2026-09-17 (user request, same evening): 19/day still too much.
  # 0.7 -> 0.65 on 2026-10-18 (user request): 0.7 was down to 9/day and the 10-card
  # cap already bound on busy days; 0.65 gives ~24/day before the cap (~8 minimum on
  # a quiet day instead of 3) for a near-identical token cost, since the cap is what
  # bounds the daily-cards run. Measured 2026-10-11..17: 0.7=9/day, 0.65=24/day.
  # Measured on the 2026-09-16/17 backlog: 0.6=48, 0.65=19, 0.7=6 items/day.
  score_threshold: 0.65
  # Cards emitted per day (best scores first; the rest are skipped for good).
  # 10 -> 14 on 2026-10-18, then 14 -> 3 on 2026-11-07: 14 cards/day produced 98
  # cards and ZERO reactions in a week — the channel was a firehose, not a
  # selection. 3 is a decision the reader can make in 20 seconds.
  max_cards: 3
  # Chars of source content handed to the summariser per card (favorite feeds get a
  # richer extract). Kept at 2000/3500: a 1500/2500 cut measured IDENTICAL payloads
  # (real sources are already shorter), so lowering it would only risk thin summaries.
  content_limit: 2000
  favorite_content_limit: 3500

