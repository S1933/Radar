timezone: Europe/Paris

log_level: info

database:
  host: postgres
  port: 5432
  user: radar
  password: radar
  name: radar

briefing:
  schedules: ["08:00", "14:00", "20:00"]  # 3 daily briefings (was single 07:00)
  max_items: 10
  max_trends: 3

topics:
  - ai
  - coding-agents
  - software-engineering
  - devops
  - open-source
  - go
  - php
  - typescript

rss:
  enabled: true
  feeds:
    - name: AWS Application Management
      url: http://blogs.aws.amazon.com/application-management/blog/feed/recentPosts.rss
      topics: [devops, software-engineering]
    - name: Yoan Dev
      url: https://flux.yoandev.co/rss.xml
      topics: [software-engineering, php]
    - name: Hacker News Front Page
      url: https://hnrss.org/frontpage
      topics: [software-engineering, open-source, ai]
    - name: HumanCoders
      url: http://news.humancoders.com/items/feed.rss
      topics: [software-engineering, php]
    - name: Le Monde IA
      url: http://www.lemonde.fr/intelligence-artificielle/rss_full.xml
      topics: [ai]
    - name: Korben
      url: http://feeds.feedburner.com/KorbensBlog-UpgradeYourMind
      topics: [software-engineering, devops, ai]
    - name: Le Monde Sciences
      url: http://www.lemonde.fr/rss/tag/sciences.xml
      topics: [science]
    - name: Cloudflare Blog
      url: https://blog.cloudflare.com/rss/
      topics: [devops, software-engineering, ai]
    - name: Le Figaro Sciences
      url: http://www.lefigaro.fr/rss/figaro_sciences.xml
      topics: [science, ai]

reddit:
  enabled: true
  every: 60m   # own poll interval (throttled 2.5s/sub) to avoid 429 from Reddit edge
  listing: new  # fetch newest posts (not "hot") — fresher signal for the radar
  subreddits:
    - opencodeCLI
    - aiagents
    - LocalLLaMA
    - golang
    - devops
    - actutech
    - ClaudeAI
    - ClaudeCode
    - CLI
    - codex
    - developpeurs
    - Playwright
    - Python
    - rust
    - ZaiGLM
    - claudeskills   # Claude Skills (Anthropic) — instructions/scripts/resources for Claude
  limit: 25

