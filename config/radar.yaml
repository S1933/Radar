mcp:
  # Hermes France MCP — veille de la communauté Discord Hermes France, exposée
  # en serveur MCP (transport HTTP streamable, lecture seule, sans token).
  # Le collector lit get_recent et transforme les messages qui partagent un
  # lien en items radar (score, dédup avec RSS/X, cartes #radar).
  enabled: true
  url: https://vps-srv1053190.tail927db4.ts.net/mcp
  name: hermes-france
  channels: []        # vide = tous les salons suivis par le serveur
  hours: 6            # fenêtre par cycle (le collect tourne toutes les 20 min)
  limit: 100          # max du serveur ; au-delà le collector repasse salon par salon
  min_chars: 0        # 0 = pas de filtre de longueur
  min_reactions: 0    # >0 = ne garder que les messages validés par la communauté
  allow_linkless: false  # true = ingérer aussi les messages sans lien (non postables en carte)
  topics: [ai, coding-agents]
  timeout: 60s

models:
  base_url: https://opencode.ai/zen/go/v1
  llm_rank: false  # Stage-2 LLM scoring is slow (1 call/item); heuristic is default
  # Stage-2 scorer: heuristic | llm | jev. "jev" needs TYPESAFE_API_KEY in the
  # environment; without it the ranker logs a warning and falls back to the
  # heuristic, so this line is safe to keep in place.
  rank_engine: jev
  jev:
    base_url: https://api.typesafe.ai/v1
    model: jev-latest
    timeout: 20s
    include_threshold: 0.6
  filter:
    model: deepseek-v4-flash
  rank:
    model: deepseek-v4-flash
  synthesis:
    model: deepseek-v4-flash
