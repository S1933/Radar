services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  radar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RADAR_DB_HOST: postgres
      RADAR_DB_PORT: "5432"
      RADAR_DB_USER: radar
      RADAR_DB_PASSWORD: radar
      RADAR_DB_NAME: radar
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}   # Jev Stage-2 ranker (ranking/jev.go)
      X_AUTH_TOKEN: ${X_AUTH_TOKEN}
      X_CT0: ${X_CT0}
    volumes:
      - ../config:/app/config:ro
      - x_scrape_db:/app/data  # persist twscrape rate-limit/cache state (DB at /app/data/x_accounts.db) across recreates — fresh DB = bursty 429s
    command: ["run", "-config", "config/radar.yaml"]
    restart: unless-stopped

volumes:
  pgdata:
  x_scrape_db:
